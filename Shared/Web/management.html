<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Byway Management</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/management.css">
  <script src="/management.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>Byway</h1>
      <button id="copy" type="button" data-message="copy">Copy page link</button>
    </header>
    <section id="login" class="panel" aria-labelledby="login-title">
      <h2 id="login-title" data-message="connectDevice">Connect to a device</h2>
      <p class="muted" id="endpoint"></p>
      <form id="login-form" method="post">
        <label for="token" data-message="accessToken">Access token</label>
        <div class="actions">
          <input id="token" type="password" required autocomplete="off" spellcheck="false">
          <button class="primary" type="submit" data-message="connect">Connect</button>
        </div>
      </form>
    </section>
    <section id="dashboard" hidden aria-labelledby="device-name">
      <div class="panel identity">
        <div>
          <h2 id="device-name"></h2>
          <p class="muted" id="device-code"></p>
        </div>
        <div class="actions">
          <button id="refresh" type="button" data-message="refresh">Refresh</button>
          <button id="disconnect" type="button" data-message="disconnect">Disconnect page</button>
        </div>
      </div>
      <div class="overview">
        <section class="panel">
          <h2 data-message="proxyStatus">Proxy status</h2>
          <dl>
            <div><dt data-message="connection">Connection</dt><dd id="connected"></dd></div>
            <div><dt data-message="currentNode">Current node</dt><dd id="node"></dd></div>
            <div><dt data-message="routingProfile">Routing profile</dt><dd id="routing"></dd></div>
          </dl>
        </section>
        <section class="panel">
          <h2 data-message="deviceInfo">Device information</h2>
          <dl>
            <div><dt data-message="device">Device</dt><dd id="hardware"></dd></div>
            <div><dt data-message="systemVersion">OS version</dt><dd id="system"></dd></div>
            <div><dt data-message="appVersion">Byway version</dt><dd id="version"></dd></div>
          </dl>
        </section>
      </div>
      <section class="panel">
        <h2 data-message="rename">Rename device</h2>
        <form id="rename-form" method="post">
          <label for="name" data-message="deviceName">Device name</label>
          <div class="actions">
            <input id="name" type="text" required>
            <button class="primary" type="submit" data-message="save">Save</button>
          </div>
        </form>
      </section>
      <section id="discovery" class="panel" hidden>
        <h2 data-message="discovery">LAN discovery</h2>
        <p id="discovery-status" class="muted"></p>
        <div class="actions">
          <button id="discovery-toggle" type="button"></button>
          <a id="discovery-ip" hidden data-message="openIp">Open IP address</a>
        </div>
      </section>
    </section>
    <p id="notice" role="status" aria-live="polite"></p>
    <input id="copy-fallback" class="visually-hidden" type="text" readonly tabindex="-1" aria-label="Management page link" data-message-label="pageLink">
  </main>
</body>
</html>
